
<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ڈیجیٹل گھڑی اور سٹاپ واچ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1f4068, #162447);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }
        .container {
            background: #0f3460;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 380px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #e94560;
            font-size: 24px;
        }
        .clock-box {
            background: #162447;
            padding: 20px;
            border-radius: 12px;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
            border: 2px solid #e94560;
            color: #0fff95;
        }
        .stopwatch-box {
            background: #162447;
            padding: 15px;
            border-radius: 12px;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffffff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: 0.3s;
        }
        .start-btn { background: #28a745; }
        .start-btn:hover { background: #218838; }
        
        .stop-btn { background: #dc3545; }
        .stop-btn:hover { background: #c82333; }
        
        .reset-btn { background: #ffc107; color: #333; }
        .reset-btn:hover { background: #e0a800; }
    </style>
</head>
<body>

    <div class="container">
        <h2>ڈیجیٹل گھڑی</h2>
        <div class="clock-box" id="digitalClock">00:00:00 AM</div>

        <h2>سٹاپ واچ</h2>
        <div class="stopwatch-box" id="stopwatch">00:00:00</div>
        
        <div class="btn-group">
            <button class="start-btn" onclick="startStopwatch()">شروع کریں</button>
            <button class="stop-btn" onclick="stopStopwatch()">روکیں</button>
            <button class="reset-btn" onclick="resetStopwatch()">دوبارہ شروع</button>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';

            hours = hours % 12;
            hours = hours ? hours : 12;

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            document.getElementById('digitalClock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        let seconds = 0, minutes = 0, hours = 0;
        let timer = null;

        function startStopwatch() {
            if (timer !== null) return;
            timer = setInterval(() => {
                seconds++;
                if (seconds === 60) {
                    seconds = 0;
                    minutes++;
                    if (minutes === 60) {
                        minutes = 0;
                        hours++;
                    }
                }
                
                let h = hours < 10 ? '0' + hours : hours;
                let m = minutes < 10 ? '0' + minutes : minutes;
                let s = seconds < 10 ? '0' + seconds : seconds;

                document.getElementById('stopwatch').innerText = `${h}:${m}:${s}`;
            }, 1000);
        }

        function stopStopwatch() {
            clearInterval(timer);
            timer = null;
        }

        function resetStopwatch() {
            stopStopwatch();
            seconds = 0; minutes = 0; hours = 0;
            document.getElementById('stopwatch').innerText = "00:00:00";
        }
    </script>

</body>
</html>
